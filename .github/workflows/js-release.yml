name: i18nify Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/i18nify-js/**'
      - 'packages/i18nify-react/**'
      - 'i18nify-data/**'
      - '.changeset/**'

permissions:
  id-token: write  # Required for OIDC
  contents: write  # changesets pushes the version-bump commit / changeset-release branch
  pull-requests: write  # changesets opens/updates the "update version" release PR
  packages: write  # publish @razorpay/i18nify-js to GitHub Packages (npm.pkg.github.com)

env:
  GITHUB_ACCESS_TOKEN: ${{ secrets.CI_BOT_TOKEN }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest # nosemgrep: non-self-hosted-runner
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          # Use the bot PAT so changesets pushes as CI_BOT_TOKEN (which can write
          # to protected branches) instead of the default github-actions[bot],
          # which was getting 403 on `git push ... changeset-release/master`.
          token: ${{ secrets.CI_BOT_TOKEN }}
      # npm publishes with OIDC trusted publishing (no NPM_TOKEN secret), which
      # needs npm >= 11.5.1. Node 20.3.1 shipped npm 9.x, so every publish since
      # NPM_TOKEN was removed failed with ENEEDAUTH. Node 24 ships npm 11.5.1+.
      - name: Use Node v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: yarn
      - name: Build core package
        run: yarn build-js
      - name: Create Release Pull Request & Publish packages
        id: changesets
        uses: changesets/action@v1
        if: github.event_name != 'workflow_dispatch' # only run on master merges
        env:
          GITHUB_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        with:
          publish: yarn release
          commit: 'build(i18nify): update version'
          title: 'build(i18nify): update version'
      - name: Publish to public npm registry
        if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch' # run when the package is published via changeset or if a release is triggered manually.
        # On a manual re-sync dispatch the current version may already exist on
        # public npm (npm rejects republishing it). Don't let that abort the job
        # before the GitHub Packages publish below. Normal push releases (a new
        # version via changesets) still fail loudly on a real publish error.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        run: cd packages/i18nify-js; npm publish --registry https://registry.npmjs.org --force
      # Also publish to GitHub Packages. Consumers that install @razorpay/* from
      # npm.pkg.github.com (e.g. razorpay/checkout's .npmrc) were stuck on an old
      # version because the release only ever went to public npm. This step keeps
      # both registries in sync on every release.
      - name: Configure npm auth for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@razorpay'
      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        run: cd packages/i18nify-js; npm publish --registry https://npm.pkg.github.com --force
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
